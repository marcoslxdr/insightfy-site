name: Deploy Blog Insightfy

on:
  push:
    branches: [master]
    paths:
      - "apps/web/**"
      - "packages/**"
      - ".github/workflows/deploy-blog.yml"
  workflow_dispatch:

concurrency:
  group: deploy-blog
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: |
          cd apps/web
          pnpm typecheck

      - name: Verify copy contracts
        run: |
          cd apps/web
          node --test scripts/site-copy-overrides.test.mjs

      - name: Build (production)
        env:
          NEXT_PUBLIC_SITE_URL: https://insightfy.com.br
        run: |
          cd apps/web
          pnpm build

      - name: Prepare release bundle
        run: |
          RELEASE_SHA="$(git rev-parse --short=8 HEAD)"
          echo "RELEASE_SHA=${RELEASE_SHA}" >> "$GITHUB_ENV"
          # dist do Next standalone + scripts de runtime + assets estáticos
          mkdir -p dist/scripts
          cp -a apps/web/.next/standalone/. dist/
          cp -a apps/web/.next/static dist/apps/web/.next/static
          cp -a apps/web/public dist/apps/web/public
          cp apps/web/scripts/verify-site-spec.mjs dist/scripts/
          cp apps/web/scripts/verify-copy-overrides.mjs dist/scripts/
          tar -czf release.tar.gz -C dist .
          echo "RELEASE_BUNDLE=release.tar.gz" >> "$GITHUB_ENV"

      - name: Deploy to VPS (rsync via SSH)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "release.tar.gz"
          target: "/tmp/insightfy-release"
          strip_components: 0

      - name: Install release on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            command -v bash >/dev/null 2>&1 || { echo "bash is required" >&2; exit 1; }
            bash -Eeuo pipefail <<'DEPLOY_SCRIPT'
            set -Eeuo pipefail
            RELEASE_SHA="${{ env.RELEASE_SHA }}"
            RELEASE_DIR="/srv/insightfy-site/releases/${RELEASE_SHA}-${{ github.run_id }}-${{ github.run_attempt }}"
            CURRENT_LINK="/srv/insightfy-site/current"
            NEXT_LINK="/srv/insightfy-site/.current-next-${{ github.run_id }}-${{ github.run_attempt }}"
            PREVIOUS_RELEASE=""
            ROLLING_BACK=0
            if [ -L "${CURRENT_LINK}" ]; then
              PREVIOUS_RELEASE="$(readlink -f "${CURRENT_LINK}")"
            fi

            rollback() {
              local failure_code="${1:-1}"
              if [ "${ROLLING_BACK}" -eq 1 ]; then
                exit "${failure_code}"
              fi
              ROLLING_BACK=1
              trap - ERR
              echo "Deploy failed; restoring previous release ${PREVIOUS_RELEASE:-none}"
              if [ -f /run/insightfy-site.pid ]; then
                stop_pid "$(cat /run/insightfy-site.pid)" || \
                  echo "Warning: failed to stop unhealthy process before rollback" >&2
              fi
              if [ -n "${PREVIOUS_RELEASE}" ] && [ -d "${PREVIOUS_RELEASE}" ]; then
                switch_current "${PREVIOUS_RELEASE}"
                cd "${PREVIOUS_RELEASE}"
                if [ -f .env ]; then
                  set -a; . ./.env; set +a
                fi
                nohup env PORT=3010 HOSTNAME=127.0.0.1 NEXT_PUBLIC_SITE_URL=https://insightfy.com.br node apps/web/server.js > /var/log/insightfy-site.log 2>&1 &
                echo $! > /run/insightfy-site.pid
                if wait_ready "${PREVIOUS_RELEASE}"; then
                  echo "Rollback OK: ${PREVIOUS_RELEASE}"
                else
                  echo "ROLLBACK FAILED: previous release unhealthy" >&2
                fi
              else
                echo "ROLLBACK FAILED: no previous release" >&2
              fi
              exit "${failure_code}"
            }

            stop_pid() {
              local pid="$1"
              local proc_dir="/proc/${pid}"
              if ! [[ "${pid}" =~ ^[0-9]+$ ]]; then
                echo "Invalid PID: ${pid}" >&2
                return 1
              fi
              if [ ! -d "${proc_dir}" ]; then
                return 0
              fi
              if ! kill -0 "${pid}" 2>/dev/null; then
                echo "Cannot signal existing process ${pid}" >&2
                return 1
              fi
              if ! kill -TERM "${pid}" 2>/dev/null; then
                echo "Failed to terminate process ${pid}" >&2
                return 1
              fi
              for _ in 1 2 3 4 5; do
                [ ! -d "${proc_dir}" ] && return 0
                sleep 1
              done
              kill -KILL "${pid}" 2>/dev/null || true
              for _ in 1 2 3; do
                [ ! -d "${proc_dir}" ] && return 0
                sleep 1
              done
              echo "Process ${pid} did not stop" >&2
              return 1
            }

            switch_current() {
              local target="$1"
              rm -f "${NEXT_LINK}"
              ln -s "${target}" "${NEXT_LINK}"
              mv -Tf "${NEXT_LINK}" "${CURRENT_LINK}"
            }

            wait_ready() {
              local expected_release="$1"
              local pid=""
              local cwd=""
              local html=""
              local asset=""
              for attempt in 1 2 3 4 5 6; do
                pid="$(cat /run/insightfy-site.pid 2>/dev/null || true)"
                cwd="$(readlink -f "/proc/${pid}/cwd" 2>/dev/null || true)"
                html="$(curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3010/pt || true)"
                asset="$(printf '%s' "${html}" | grep -oE '/_next/static/(css|chunks)/[^" ]+\.(css|js)' | head -n 1 || true)"
                if [ "${cwd}" = "${expected_release}/apps/web" ] && \
                   [ -n "${asset}" ] && \
                   curl --fail --silent --show-error --max-time 10 "http://127.0.0.1:3010${asset}" >/dev/null && \
                   curl --fail --silent --show-error --max-time 10 "https://insightfy.com.br${asset}" >/dev/null && \
                   curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3010/pt/blog >/dev/null; then
                  return 0
                fi
                sleep 2
              done
              return 1
            }
            trap 'rollback $?' ERR

            mkdir -p "${RELEASE_DIR}"
            tar -xzf /tmp/insightfy-release/release.tar.gz -C "${RELEASE_DIR}"
            # carregar env de produção (NEXT_PUBLIC_* e PORT) se existir
            if [ -f /srv/insightfy-site/.env ]; then
              cp /srv/insightfy-site/.env "${RELEASE_DIR}/.env"
            fi
            test -f "${RELEASE_DIR}/apps/web/server.js"
            switch_current "${RELEASE_DIR}"
            # reiniciar somente processo deste site pelo PID dedicado
            if [ -f /run/insightfy-site.pid ]; then
              stop_pid "$(cat /run/insightfy-site.pid)"
            fi
            cd "${RELEASE_DIR}"
            if [ -f .env ]; then
              set -a; . ./.env; set +a
            fi
            nohup env PORT=3010 HOSTNAME=127.0.0.1 NEXT_PUBLIC_SITE_URL=https://insightfy.com.br INSIGHTFY_BUILD_SHA="${RELEASE_SHA}" node apps/web/server.js > /var/log/insightfy-site.log 2>&1 &
            echo $! > /run/insightfy-site.pid
            wait_ready "${RELEASE_DIR}"
            echo "Site ready (release ${RELEASE_SHA}; path ${RELEASE_DIR})"
            trap - ERR
            # Best-effort retention; deployment is already healthy.
            ls -1dt /srv/insightfy-site/releases/*/ | tail -n +6 | xargs -r rm -rf || \
              echo "Warning: old release cleanup failed" >&2
            rm -f "${NEXT_LINK}" || true
            DEPLOY_SCRIPT
