name: Deploy Blog Insightfy

on:
  push:
    branches: [master]
    paths:
      - "apps/web/**"
      - "packages/**"
      - ".github/workflows/deploy-blog.yml"
  workflow_dispatch:

concurrency:
  group: deploy-blog
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: |
          cd apps/web
          pnpm typecheck

      - name: Build (production)
        env:
          NEXT_PUBLIC_SITE_URL: https://insightfy.com.br
        run: |
          cd apps/web
          pnpm build

      - name: Prepare release bundle
        run: |
          RELEASE_SHA="$(git rev-parse --short=8 HEAD)"
          echo "RELEASE_SHA=${RELEASE_SHA}" >> "$GITHUB_ENV"
          # dist do Next standalone + scripts de runtime + assets estáticos
          mkdir -p dist/scripts
          cp -a apps/web/.next/standalone/. dist/
          cp -a apps/web/.next/static dist/apps/web/.next/static
          cp -a apps/web/public dist/apps/web/public
          cp apps/web/scripts/verify-site-spec.mjs dist/scripts/
          cp apps/web/scripts/verify-copy-overrides.mjs dist/scripts/
          tar -czf release.tar.gz -C dist .
          echo "RELEASE_BUNDLE=release.tar.gz" >> "$GITHUB_ENV"

      - name: Deploy to VPS (rsync via SSH)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "release.tar.gz"
          target: "/tmp/insightfy-release"
          strip_components: 0

      - name: Install release on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            RELEASE_SHA="${{ env.RELEASE_SHA }}"
            RELEASE_DIR="/srv/insightfy-site/releases/${RELEASE_SHA}"
            rm -rf "${RELEASE_DIR}"
            mkdir -p "${RELEASE_DIR}"
            tar -xzf /tmp/insightfy-release/release.tar.gz -C "${RELEASE_DIR}"
            # carregar env de produção (NEXT_PUBLIC_* e PORT) se existir
            if [ -f /srv/insightfy-site/.env ]; then
              cp /srv/insightfy-site/.env "${RELEASE_DIR}/.env"
            fi
            ln -sfn "${RELEASE_DIR}" /srv/insightfy-site/current
            # reiniciar somente processo deste site; não tocar em outros serve-vps
            if [ -f /run/insightfy-site.pid ]; then
              kill "$(cat /run/insightfy-site.pid)" 2>/dev/null || true
            fi
            pkill -f '/srv/insightfy-site/current/scripts/serve-vps.mjs' || true
            sleep 1
            cd "${RELEASE_DIR}"
            if [ -f .env ]; then
              set -a; . ./.env; set +a
            fi
            nohup env PORT=3010 HOSTNAME=127.0.0.1 NEXT_PUBLIC_SITE_URL=https://insightfy.com.br INSIGHTFY_BUILD_SHA="${RELEASE_SHA}" node apps/web/server.js > /var/log/insightfy-site.log 2>&1 &
            echo $! > /run/insightfy-site.pid
            sleep 4
            # health check
            curl -sf -o /dev/null http://127.0.0.1:3010/pt/blog && echo "✅ Site no ar (release ${RELEASE_SHA})" || echo "⚠️ Health check falhou"
            # limpar releases antigos (manter últimos 5)
            ls -1dt /srv/insightfy-site/releases/*/ | tail -n +6 | xargs -r rm -rf
